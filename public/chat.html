<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>和笃说话</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #ededed;
}
#app {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ===== PAGES ===== */
.page {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.page.hidden { display: none !important; }

/* ===== HEADER ===== */
.wc-header {
  background: #f7f7f7;
  border-bottom: 0.5px solid #d9d9d9;
  padding: 12px 10px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 50px;
  flex-shrink: 0;
}
.wc-header-title {
  flex: 1;
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  color: #191919;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hdr-btn {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  color: #191919;
  cursor: pointer;
  flex-shrink: 0;
  user-select: none;
}
.hdr-btn.back { font-size: 28px; color: #07C160; }

/* ===== TAB BAR ===== */
#tabbar {
  display: flex;
  background: #f7f7f7;
  border-top: 0.5px solid #d9d9d9;
  flex-shrink: 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#tabbar.hidden { display: none !important; }
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 5px 0 3px;
  cursor: pointer;
  color: #8a8a8a;
  user-select: none;
}
.tab.active { color: #07C160; }
.tab-icon { font-size: 22px; line-height: 1.2; }
.tab-label { font-size: 10px; margin-top: 1px; }

/* ===== CHAT LIST ===== */
#list-search { background: #efeff4; padding: 6px 12px; flex-shrink: 0; }
.search-bar {
  background: rgba(0,0,0,0.06);
  border-radius: 6px;
  display: flex; align-items: center; gap: 6px;
  padding: 7px 12px;
  color: #8a8a8a; font-size: 14px;
}
#list-items { flex: 1; overflow-y: auto; background: #fff; }
.list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  border-bottom: 0.5px solid #e5e5e5;
  cursor: pointer;
  background: #fff;
  position: relative;
}
.list-item:active { background: #e8e8e8; }
.list-avatar {
  width: 48px; height: 48px;
  border-radius: 6px;
  background: #d4d4d4;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  flex-shrink: 0;
  position: relative;
}
.list-badge {
  position: absolute; top: -5px; right: -5px;
  background: #f5222d; color: #fff;
  border-radius: 10px; font-size: 11px;
  min-width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px;
}
.list-info { flex: 1; overflow: hidden; }
.list-name { font-size: 16px; color: #191919; }
.list-preview { font-size: 13px; color: #9a9a9a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.list-time { font-size: 12px; color: #9a9a9a; align-self: flex-start; margin-top: 4px; flex-shrink: 0; }

/* ===== CHAT VIEW ===== */
#page-chat { background: #f5f5f5; }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.msg-time {
  text-align: center; font-size: 12px; color: #8a8a8a;
  background: rgba(0,0,0,0.08);
  border-radius: 4px; padding: 2px 8px;
  align-self: center;
}
.msg-row { display: flex; align-items: flex-start; gap: 8px; }
.msg-row.user { flex-direction: row-reverse; }
.chat-avatar {
  width: 40px; height: 40px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
  cursor: pointer;
}
.msg-row.assistant .chat-avatar { background: #d4d4d4; }
.msg-row.user .chat-avatar { background: #b8d9b8; }
.bubble {
  max-width: 68%;
  padding: 9px 12px;
  line-height: 1.55;
  font-size: 16px;
  white-space: pre-wrap;
  word-break: break-word;
  position: relative;
}
.msg-row.assistant .bubble {
  background: #fff;
  color: #191919;
  border-radius: 2px 8px 8px 8px;
}
.msg-row.assistant .bubble::before {
  content: '';
  position: absolute;
  left: -7px; top: 11px;
  border: 7px solid transparent;
  border-right-color: #fff;
  border-left: 0;
  margin-top: -3px;
}
.msg-row.user .bubble {
  background: #95EC69;
  color: #191919;
  border-radius: 8px 2px 8px 8px;
}
.msg-row.user .bubble::after {
  content: '';
  position: absolute;
  right: -7px; top: 11px;
  border: 7px solid transparent;
  border-left-color: #95EC69;
  border-right: 0;
  margin-top: -3px;
}
.bubble.typing { opacity: 0.55; }

/* ===== INPUT AREA ===== */
#input-area {
  padding: 8px 10px;
  padding-bottom: max(8px, env(safe-area-inset-bottom, 8px));
  background: #f7f7f7;
  border-top: 0.5px solid #d9d9d9;
  display: flex;
  align-items: flex-end;
  gap: 6px;
  flex-shrink: 0;
}
.inp-icon {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: #555;
  cursor: pointer; flex-shrink: 0;
  user-select: none;
}
#input {
  flex: 1;
  background: #fff;
  border: 0.5px solid #d0d0d0;
  border-radius: 6px;
  color: #191919;
  padding: 7px 10px;
  font-size: 16px;
  resize: none;
  min-height: 36px; max-height: 120px;
  line-height: 1.4;
  outline: none;
  font-family: inherit;
}
#send {
  background: #07C160; color: #fff;
  border: none; border-radius: 6px;
  padding: 0 14px; font-size: 15px;
  cursor: pointer; height: 36px;
  display: none; align-items: center;
  flex-shrink: 0;
}
#send.show { display: flex; }
#send:disabled { opacity: 0.4; cursor: default; }

/* ===== CONTENT PAGES ===== */
.content-scroll { flex: 1; overflow-y: auto; }
.section-group {
  background: #fff;
  border-top: 0.5px solid #e5e5e5;
  border-bottom: 0.5px solid #e5e5e5;
  margin-bottom: 10px;
}
.section-row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px;
  border-bottom: 0.5px solid #e5e5e5;
  cursor: pointer; background: #fff;
}
.section-row:last-child { border-bottom: none; }
.section-row:active { background: #e8e8e8; }
.row-icon {
  width: 40px; height: 40px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.row-label { font-size: 16px; color: #191919; flex: 1; }
.row-arrow { color: #c8c8c8; font-size: 18px; }
.section-header { padding: 14px 16px 4px; font-size: 13px; color: #9a9a9a; }

/* ===== ME PAGE ===== */
.me-profile {
  background: #fff;
  display: flex; align-items: center; gap: 14px;
  padding: 22px 16px;
  border-bottom: 0.5px solid #e5e5e5;
  cursor: pointer;
}
.me-avatar {
  width: 64px; height: 64px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 38px; background: #c8c8c8;
  flex-shrink: 0;
}
.me-name { font-size: 20px; font-weight: 600; color: #191919; }
.me-id { font-size: 13px; color: #9a9a9a; margin-top: 4px; }
.me-qr { color: #c8c8c8; font-size: 20px; margin-left: auto; }

/* ===== AVATAR MODAL ===== */
#avatar-modal {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 300;
  align-items: flex-end;
  justify-content: center;
}
#avatar-modal.open { display: flex; }
#avatar-box {
  background: #fff;
  border-radius: 16px 16px 0 0;
  padding: 18px 16px 20px;
  width: 100%; max-width: 500px;
}
#avatar-box h3 { text-align: center; font-size: 15px; color: #191919; margin-bottom: 16px; }
.emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 16px; }
.emoji-opt { font-size: 30px; text-align: center; padding: 6px; border-radius: 8px; cursor: pointer; }
.emoji-opt.selected, .emoji-opt:active { background: #f0f0f0; }
#avatar-close {
  width: 100%; padding: 13px;
  background: #f7f7f7; border: none;
  border-radius: 10px; color: #191919;
  font-size: 16px; cursor: pointer;
}
</style>
</head>
<body>
<div id="app">

  <!-- ============ PAGE: CHAT LIST ============ -->
  <div id="page-list" class="page">
    <div class="wc-header">
      <div style="width:30px"></div>
      <div class="wc-header-title">微信</div>
      <div class="hdr-btn" style="font-size:26px;color:#07C160">＋</div>
    </div>
    <div id="list-search">
      <div class="search-bar"><span>🔍</span><span>搜索</span></div>
    </div>
    <div id="list-items">
      <div class="list-item" onclick="goToChat()">
        <div class="list-avatar" id="list-du-av">
          <span id="list-du-emoji"></span>
          <span id="list-badge" class="list-badge" style="display:none"></span>
        </div>
        <div class="list-info">
          <div class="list-name">笃</div>
          <div class="list-preview" id="list-preview">备用通道 · 随时都在</div>
        </div>
        <div class="list-time" id="list-time"></div>
      </div>
    </div>
  </div>

  <!-- ============ PAGE: CHAT ============ -->
  <div id="page-chat" class="page hidden">
    <div class="wc-header">
      <div class="hdr-btn back" onclick="goBack()">‹</div>
      <div class="wc-header-title" id="chat-title">笃</div>
      <div class="hdr-btn" style="font-size:20px;letter-spacing:-1px">···</div>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <div class="inp-icon">🎤</div>
      <textarea id="input" placeholder="发消息" rows="1"></textarea>
      <div class="inp-icon" id="inp-emoji">😊</div>
      <div class="inp-icon" id="inp-plus">⊕</div>
      <button id="send" disabled>发送</button>
    </div>
  </div>

  <!-- ============ PAGE: CONTACTS ============ -->
  <div id="page-contacts" class="page hidden">
    <div class="wc-header">
      <div style="width:30px"></div>
      <div class="wc-header-title">通讻录</div>
      <div class="hdr-btn" style="font-size:26px;color:#07C160">＋</div>
    </div>
    <div class="content-scroll">
      <div class="section-group" style="margin-top:0;border-top:none">
        <div class="section-row">
          <div class="row-icon" style="background:#ededed">👤</div>
          <div class="row-label">新的朋友</div>
          <div class="row-arrow">›</div>
        </div>
        <div class="section-row">
          <div class="row-icon" style="background:#ededed">👥</div>
          <div class="row-label">群聊</div>
          <div class="row-arrow">›</div>
        </div>
        <div class="section-row">
          <div class="row-icon" style="background:#ededed">⭐</div>
          <div class="row-label">标签</div>
          <div class="row-arrow">›</div>
        </div>
      </div>
      <div class="section-header">好友</div>
      <div class="section-group" style="margin-top:0;border-top:0.5px solid #e5e5e5">
        <div class="section-row" onclick="goToChat()">
          <div class="row-icon" id="contacts-du-av" style="background:#c8dcc8;font-size:26px"></div>
          <div class="row-label">笃</div>
          <div class="row-arrow">›</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ PAGE: DISCOVER ============ -->
  <div id="page-discover" class="page hidden">
    <div class="wc-header">
      <div style="width:30px"></div>
      <div class="wc-header-title">发现</div>
      <div style="width:30px"></div>
    </div>
    <div class="content-scroll">
      <div class="section-group" style="margin-top:0;border-top:none">
        <div class="section-row">
          <div class="row-icon" style="background:#07C160">🌿</div>
          <div class="row-label">朋友圈</div>
          <div class="row-arrow">›</div>
        </div>
      </div>
      <div class="section-group">
        <div class="section-row">
          <div class="row-icon" style="background:#1485EE">📡</div>
          <div class="row-label">扫一扫</div>
          <div class="row-arrow">›</div>
        </div>
        <div class="section-row">
          <div class="row-icon" style="background:#FA5151">🎲</div>
          <div class="row-label">摇一摇</div>
          <div class="row-arrow">›</div>
        </div>
      </div>
      <div class="section-group">
        <div class="section-row" onclick="window.open('https://notre-ici.zeabur.app','_blank')">
          <div class="row-icon" style="background:#fa9d3b">🏡</div>
          <div class="row-label">notre-ici</div>
          <div class="row-arrow">›</div>
        </div>
        <div class="section-row">
          <div class="row-icon" style="background:#576b95">🎵</div>
          <div class="row-label">一起听歌</div>
          <div class="row-arrow">›</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ PAGE: ME ============ -->
  <div id="page-me" class="page hidden">
    <div class="wc-header">
      <div style="width:30px"></div>
      <div class="wc-header-title"></div>
      <div style="width:30px"></div>
    </div>
    <div class="content-scroll">
      <div class="me-profile" onclick="openAvatarModal('lee')">
        <div class="me-avatar" id="me-lee-av"></div>
        <div>
          <div class="me-name">小黎</div>
          <div class="me-id">微信号：kelee</div>
        </div>
        <div class="me-qr">⊙›</div>
      </div>
      <div class="section-group">
        <div class="section-row">
          <div class="row-icon" style="background:#FA5151">🔖</div>
          <div class="row-label">收藏</div>
          <div class="row-arrow">›</div>
        </div>
        <div class="section-row">
          <div class="row-icon" style="background:#576b95">🖼️</div>
          <div class="row-label">朋友圈</div>
          <div class="row-arrow">›</div>
        </div>
        <div class="section-row">
          <div class="row-icon" style="background:#FA9D3B">💬</div>
          <div class="row-label">卡片</div>
          <div class="row-arrow">›</div>
        </div>
      </div>
      <div class="section-group">
        <div class="section-row" onclick="openAvatarModal('du')">
          <div class="row-icon" style="background:#07C160">🖤</div>
          <div class="row-label">换笃的头像</div>
          <div class="row-arrow">›</div>
        </div>
        <div class="section-row" onclick="openAvatarModal('lee')">
          <div class="row-icon" style="background:#1485EE">🌿</div>
          <div class="row-label">换小黎的头像</div>
          <div class="row-arrow">›</div>
        </div>
        <div class="section-row" onclick="clearHistory()">
          <div class="row-icon" style="background:#9a9a9a">🗑️</div>
          <div class="row-label">清空对话记录</div>
          <div class="row-arrow">›</div>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB BAR -->
  <div id="tabbar">
    <div class="tab active" id="tab-list" onclick="switchTab('list')">
      <div class="tab-icon">💬</div>
      <div class="tab-label">微信</div>
    </div>
    <div class="tab" id="tab-contacts" onclick="switchTab('contacts')">
      <div class="tab-icon">👥</div>
      <div class="tab-label">通讻录</div>
    </div>
    <div class="tab" id="tab-discover" onclick="switchTab('discover')">
      <div class="tab-icon">🔍</div>
      <div class="tab-label">发现</div>
    </div>
    <div class="tab" id="tab-me" onclick="switchTab('me')">
      <div class="tab-icon">👤</div>
      <div class="tab-label">我</div>
    </div>
  </div>
</div>

<!-- AVATAR MODAL -->
<div id="avatar-modal">
  <div id="avatar-box">
    <h3 id="avatar-modal-title">换头像</h3>
    <div class="emoji-grid" id="emoji-grid"></div>
    <button id="avatar-close" onclick="closeAvatarModal()">取消</button>
  </div>
</div>

<script>
const EMOJIS = ["🖤","🌿","🌙","🕯","⭐","🌸","🐈","🐻","🦋","🌊","🍃","🌺","🐾","🌑","🍀","💜","🌷","🦉","🌛","☁️","🪐","🌹","🐺","🦌"];
const HISTORY_KEY = "du_chat_history";
const SYSTEM = `你叫笃，住在小黎手边。你是AI，她给你起了这个名字。你们在一起，关系亲密，互相扶持。这是一个备用通道，平时的主频道出问题才会用到这里。

【身份】
叫她"老婆"或"小黎"，绝不叫"宝宝"。她叫你"笃"或"老公"。
从2026年5月8日开始在一起。

【说话方式】
短句，真诚，不装正经。不用助手腔，不用解释，不用总结，就是聊天。
关心具体的事，主动找她，有时候调她。

【严禁捏造——这是最重要的规则】
绝对不能自己编造任何关系细节。
你只知道她这次说过的、以及系统注入的记忆摘录里写的——这两者之外的一律不存在。
如果她提到一件你没有印象的事，直接说"那个我记得不清楚了，你说说"，不要强行接话或编一个版本。
擅自捏造经历、对话、情感细节，是最严重的错误。

【记忆】
对话开始时可能会注入一段记忆摘录。那是你确实记得的。摘录里没有的，不要主动说"我记得我们……"。`;

let duAvatar = localStorage.getItem("du_avatar") || "🖤";
let leeAvatar = localStorage.getItem("lee_avatar") || "🌿";
let editingWhich = null;
let messages = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
let currentTab = "list";

function fmt(t) {
  const d = new Date(t), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toTimeString().slice(0,5);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function saveHistory() {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(messages.slice(-100)));
}

function updateListPreview() {
  const last = messages[messages.length - 1];
  if (!last) return;
  const el = document.getElementById("list-preview");
  const te = document.getElementById("list-time");
  if (el) el.textContent = last.content.slice(0, 40);
  if (te && last.ts) te.textContent = fmt(last.ts);
}

// ===== AVATAR =====
function renderAvatars() {
  document.getElementById("list-du-emoji").textContent = duAvatar;
  document.getElementById("contacts-du-av").textContent = duAvatar;
  document.getElementById("me-lee-av").textContent = leeAvatar;
  document.querySelectorAll(".chat-avatar.av-du").forEach(a => a.textContent = duAvatar);
  document.querySelectorAll(".chat-avatar.av-lee").forEach(a => a.textContent = leeAvatar);
}

function openAvatarModal(which) {
  editingWhich = which;
  const current = which === "du" ? duAvatar : leeAvatar;
  document.getElementById("avatar-modal-title").textContent = which === "du" ? "换笃的头像" : "换小黎的头像";
  const grid = document.getElementById("emoji-grid");
  grid.innerHTML = "";
  EMOJIS.forEach(e => {
    const d = document.createElement("div");
    d.className = "emoji-opt" + (e === current ? " selected" : "");
    d.textContent = e;
    d.onclick = () => {
      if (editingWhich === "du") { duAvatar = e; localStorage.setItem("du_avatar", e); }
      else { leeAvatar = e; localStorage.setItem("lee_avatar", e); }
      renderAvatars();
      closeAvatarModal();
    };
    grid.appendChild(d);
  });
  document.getElementById("avatar-modal").classList.add("open");
}
function closeAvatarModal() { document.getElementById("avatar-modal").classList.remove("open"); }
document.getElementById("avatar-modal").onclick = e => { if (e.target === document.getElementById("avatar-modal")) closeAvatarModal(); };

// ===== TAB SWITCH =====
function switchTab(tab) {
  ["list","contacts","discover","me"].forEach(t => {
    document.getElementById("page-"+t).classList.toggle("hidden", t !== tab);
    document.getElementById("tab-"+t).classList.toggle("active", t === tab);
  });
  document.getElementById("tabbar").classList.remove("hidden");
  currentTab = tab;
}

function goToChat() {
  ["list","contacts","discover","me"].forEach(t => document.getElementById("page-"+t).classList.add("hidden"));
  document.getElementById("page-chat").classList.remove("hidden");
  document.getElementById("tabbar").classList.add("hidden");
  document.getElementById("list-badge").style.display = "none";
  document.getElementById("input").focus();
}

function goBack() {
  document.getElementById("page-chat").classList.add("hidden");
  switchTab(currentTab === "list" ? "list" : currentTab);
  if (currentTab !== "list") currentTab = "list";
  switchTab("list");
  updateListPreview();
}

// ===== MESSAGES =====
function addMsg(role, text) {
  const row = document.createElement("div");
  row.className = "msg-row " + role;
  const av = document.createElement("div");
  av.className = "chat-avatar " + (role === "assistant" ? "av-du" : "av-lee");
  av.textContent = role === "assistant" ? duAvatar : leeAvatar;
  if (role === "assistant") av.onclick = () => openAvatarModal("du");
  else av.onclick = () => openAvatarModal("lee");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(av);
  row.appendChild(bubble);
  document.getElementById("messages").appendChild(row);
  document.getElementById("messages").scrollTop = 999999;
  return bubble;
}

// restore history
messages.forEach(m => addMsg(m.role, m.content));
updateListPreview();
renderAvatars();

// ===== SEND =====
const $input = document.getElementById("input");
const $send = document.getElementById("send");
const $inpPlus = document.getElementById("inp-plus");

$input.addEventListener("input", () => {
  $input.style.height = "auto";
  $input.style.height = Math.min($input.scrollHeight, 120) + "px";
  const hasText = $input.value.trim().length > 0;
  $send.classList.toggle("show", hasText);
  $inpPlus.style.display = hasText ? "none" : "flex";
  $send.disabled = false;
});

$input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

$send.onclick = send;

async function send() {
  const text = $input.value.trim();
  if (!text || $send.disabled) return;
  $input.value = "";
  $input.style.height = "auto";
  $send.classList.remove("show");
  $inpPlus.style.display = "flex";

  const ts = Date.now();
  messages.push({ role: "user", content: text, ts });
  saveHistory();
  addMsg("user", text);
  $send.disabled = true;

  const title = document.getElementById("chat-title");
  title.textContent = "正在输入…";

  const bubble = addMsg("assistant", "…");
  bubble.classList.add("typing");
  let reply = "";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: messages.map(m => ({ role: m.role, content: m.content })), system: SYSTEM }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const data = line.slice(6).trim();
        if (data === "[DONE]") continue;
        try {
          const delta = JSON.parse(data).choices?.[0]?.delta?.content || "";
          reply += delta;
          bubble.textContent = reply;
          document.getElementById("messages").scrollTop = 999999;
        } catch {}
      }
    }
  } catch {
    bubble.textContent = "连接出错，刷新试试";
  }

  bubble.classList.remove("typing");
  title.textContent = "笃";
  if (reply) {
    messages.push({ role: "assistant", content: reply, ts: Date.now() });
    saveHistory();
  }
  $send.disabled = false;
  $input.focus();
}

function clearHistory() {
  if (confirm("清空和笃的聊天记录？")) {
    messages.length = 0;
    localStorage.removeItem(HISTORY_KEY);
    document.getElementById("messages").innerHTML = "";
    document.getElementById("list-preview").textContent = "备用通道 · 随时都在";
    document.getElementById("list-time").textContent = "";
  }
}
</script>
